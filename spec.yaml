# secure-agent-workspace — ApplicationSpec
#
# Source of truth for the Secure Agent Workspace Validated Pattern.
# Edit this file, then regenerate the outputs:
#
#   quickpat compose spec.yaml              # → vp-out/  (Validated Pattern, ArgoCD)
#   quickpat compose spec.yaml --format qs  # → qs-out/ (Helm chart, direct install)
#
# How to read this file:
#   Each setting annotated with a "← hand-written" reference shows the exact
#   field in the original validatedpatterns-sandbox/secure-agent-workspace repo
#   that it was derived from.
#
# Docs:
#   Spec format:   https://github.com/atyronesmith/quickpat/blob/main/docs/compose-tutorial.md
#   Block catalog: https://github.com/atyronesmith/quickpat/blob/main/docs/compose-tutorial.md#block-types
#   Adding blocks: https://github.com/atyronesmith/quickpat/blob/main/docs/adding-block-types.md

apiVersion: supplychain/v1alpha1
kind: ApplicationSpec

metadata:
  name: secure-agent-workspace      # ← values-global.yaml: global.pattern
  description: >-
    Isolated, per-user AI agent sandboxes on OpenShift Virtualization.
    Each user gets a dedicated KubeVirt VM running NVIDIA OpenShell with
    OIDC authentication (RHBK) and Vault-managed inference provider keys.
  tier: sandbox
  partner: NVIDIA

  # upstream: empty because this repo IS the source of all charts.
  # The original hand-written repo (validatedpatterns-sandbox/secure-agent-workspace)
  # is not a standalone QS Helm chart — it already contains the full VP structure.
  # All components are declared as custom: below.
  # Setting upstream.repo would cause the compiler to generate a spurious remote
  # ArgoCD app pointing back at the original repo.
  upstream: {}

# ── Blocks ───────────────────────────────────────────────────────────────────
#
# Each block compiles to one or more entries in values-prod.yaml:
#   type field     → clusterGroup.subscriptions.<operator-key>
#   INFRA_CHARTS   → clusterGroup.applications.<chart-name>
#   namespace_config → clusterGroup.namespaces.<ns>.operatorGroup
#
# The three block types here (openshift-virtualization, keycloak-oidc,
# vm-workspace) are not stock QuickPat blocks — they were added to
# quickpat/compose/blocks.py and quickpat/operators.py specifically for
# this pattern. See docs/adding-block-types.md.

blocks:

  # ── openshift-virtualization ────────────────────────────────────────────────
  # Compiles to:
  #   clusterGroup.subscriptions.openshift-virtualization (← values-prod.yaml)
  #     name: kubevirt-hyperconverged
  #     namespace: openshift-cnv
  #     channel: stable
  #
  #   clusterGroup.namespaces.openshift-cnv (← values-prod.yaml)
  #     operatorGroup: true
  #     targetNamespaces: [openshift-cnv]
  #
  # The HyperConverged CR itself is in charts/openshift-cnv/ which is
  # declared as a custom component below (openshift-cnv). KubeVirt + CDI
  # are activated by the HyperConverged CR once the operator is installed.
  virtualization:
    type: openshift-virtualization

  # ── keycloak-oidc ───────────────────────────────────────────────────────────
  # Compiles to:
  #   clusterGroup.subscriptions.rhbk (← values-prod.yaml)
  #     name: rhbk-operator
  #     namespace: openshell-agents    ← where the operator subscription lives
  #     channel: stable-v26
  #
  #   clusterGroup.namespaces.openshell-agents (← values-prod.yaml)
  #     operatorGroup: true
  #     targetNamespaces: [openshell-agents]
  #
  # The Keycloak CR, PostgreSQL, and KeycloakRealmImport are pattern-specific
  # (realm name, client config, test users differ per pattern) — they live in
  # charts/openshell-keycloak/ declared as a custom component below, NOT in an
  # auto-generated INFRA_CHART. This matches the hand-written repo structure.
  #
  # Outputs: issuer_url — the Keycloak OIDC issuer URL used by the sandbox
  # gateway to fetch JWKS and validate user tokens. Resolved at deploy time.
  identity:
    type: keycloak-oidc
    config:
      realm: openshell                 # ← charts/openshell-keycloak/values.yaml: realm
      operator_channel: stable-v26     # ← values-prod.yaml: subscriptions.rhbk.channel

      # Test users loaded into the openshell realm at first deploy.
      # ← charts/openshell-keycloak/templates/realm-import.yaml: users[]
      # Remove or replace with enterprise IdP federation in production.
      test_users:
        - { username: alice,     password: alice,     roles: [openshell-user, openshell-admin] }
        - { username: bob,       password: bob,       roles: [openshell-user] }
        - { username: developer, password: developer, roles: [openshell-user] }
        - { username: admin,     password: admin,     roles: [openshell-user, openshell-admin] }

  # ── vm-workspace ────────────────────────────────────────────────────────────
  # No additional operator subscriptions — depends on the openshift-virtualization
  # block for KubeVirt runtime and CDI.
  #
  # This block documents the per-user VM sandbox architecture. The actual
  # Kubernetes resources (VirtualMachine, routes, RBAC, cloud-init) are in
  # charts/openshell-saw/ declared as a custom component below.
  #
  # Outputs: gateway_route (gRPC/TLS passthrough), dashboard_route (edge TLS)
  # Both route types are defined in charts/openshell-saw/templates/route*.yaml.
  sandbox:
    type: vm-workspace
    config:
      # namespace_mode controls sandbox isolation level.
      # ← charts/openshell-saw/values.yaml: namespaceMode
      # shared  — all VMs in openshell-agents (default, scales to thousands)
      # perUser — each user gets saw-<username> namespace (Kubernetes-level isolation)
      namespace_mode: shared

      # Default provider used when openshell-saw-create is called without --provider.
      # ← charts/openshell-saw/values.yaml: defaultProvider, defaultModel
      default_provider: gemini
      default_model: gemini-2.5-flash

      # Per-VM resource sizing for the gateway VM (not the agent container inside).
      # ← charts/openshell-saw/values.yaml: resources.requests / vm.cpu / vm.memory / vm.disk
      resources:
        cpu: 4
        memory: 8Gi
        disk: 40Gi

      image:
        # Bootc-based Fedora 44 golden image — pre-bakes OpenShell, podman, nodejs.
        # ← image-builder-charts/helm/openshell-gateway-image/values.yaml: imageType, buildStrategy
        # Built once in-cluster (~15 min). CDI DataSource is cloned per user at sandbox
        # creation time. Change source: prebuilt when NVIDIA publishes upstream images.
        type: bootc
        source: build

    # SSH key ExternalSecrets are managed by the pattern-secrets custom chart
    # (charts/pattern-secrets/templates/ssh-secret.yaml and ssh-pubkey-secret.yaml).
    # Declaring them here as block-level secrets would auto-generate a duplicate
    # secure-agent-workspace-secrets chart that conflicts with pattern-secrets.
    inputs:
      # OIDC issuer URL wired from the keycloak-oidc block.
      # VP path:  computed from global.clusterDomain injected by ArgoCD
      # QS path:  detected from the Keycloak route at openshell-saw-create time
      # ← charts/openshell-saw/templates/virtualmachine.yaml: oidcIssuerUrl
      oidc_issuer: "{{ blocks.identity.output.issuer_url }}"

# ── Secrets ──────────────────────────────────────────────────────────────────
#
# Each entry maps to one named group in Vault and one entry in
# values-secret.yaml.template (VP v2 backingStore format).
#
# The ExternalSecrets that read these Vault paths at runtime are declared in
# charts/pattern-secrets/templates/<name>-secret.yaml (hand-written charts,
# ← original validatedpatterns-sandbox/secure-agent-workspace/charts/pattern-secrets/).
#
# vault_path must match the remoteRef.key in the corresponding ExternalSecret.
# Field names must match the remoteRef.property values.
#
# At least ONE inference provider must be set before a sandbox will start.
# Unset providers (onMissingValue: skip) are present in the template so the
# operator knows they exist — the sandbox simply won't offer that provider.

secrets:
  # SSH keypair for sandbox provisioning.
  # ← values-secret.yaml.template (original): name: ssh
  # ← charts/pattern-secrets/templates/ssh-secret.yaml: remoteRef.key
  # Generate with: make generate-keys  (writes to ~/values-secret.yaml)
  - name: ssh
    vault_path: secure-agent-workspace/ssh
    fields:
      - name: private_key    # injected into VM cloud-init authorized_keys
      - name: public_key     # stored in Vault for SSH agent forwarding

  # ── Inference providers ────────────────────────────────────────────────────
  # ← values-secret.yaml.template (original): name: anthropic/gemini/openai/...
  # ← charts/pattern-secrets/templates/*-secret.yaml: remoteRef.key/property

  - name: anthropic
    vault_path: secure-agent-workspace/anthropic
    onMissingValue: skip      # skip: ExternalSecret created but Vault path left empty
    fields:
      - name: api_key

  - name: gemini
    vault_path: secure-agent-workspace/gemini
    onMissingValue: skip
    fields:
      - name: api_key

  - name: openai
    vault_path: secure-agent-workspace/openai
    onMissingValue: skip
    fields:
      - name: api_key

  - name: nvidia
    vault_path: secure-agent-workspace/nvidia
    onMissingValue: skip
    fields:
      - name: api_key

  - name: openrouter
    vault_path: secure-agent-workspace/openrouter
    onMissingValue: skip
    fields:
      - name: api_key

  - name: vertex
    vault_path: secure-agent-workspace/vertex
    onMissingValue: skip
    fields:
      - name: sa_json         # full GCP service account JSON, not a bare key

  # ── Optional web search integrations ──────────────────────────────────────
  # ← values-secret.yaml.template (original): name: tavily / brave-search

  - name: tavily
    vault_path: secure-agent-workspace/tavily
    onMissingValue: skip
    fields:
      - name: api_key

  - name: brave-search
    vault_path: secure-agent-workspace/brave-search
    onMissingValue: skip
    fields:
      - name: api_key

# vault: enabled wires up HashiCorp Vault + External Secrets Operator even
# when no block-level secrets are declared. Generates:
#   clusterGroup.applications.vault            (← values-prod.yaml: applications.vault)
#   clusterGroup.applications.openshift-external-secrets  (← values-prod.yaml)
#   clusterGroup.subscriptions.openshift-external-secrets
#   clusterGroup.namespaces.vault, external-secrets, external-secrets-operator
vault:
  enabled: true   # ← values-prod.yaml: applications.vault + subscriptions.eso

# ── Wiring ───────────────────────────────────────────────────────────────────
#
# Wiring is descriptive — it documents data-flow relationships for human
# readers and future tooling. It does not generate Kubernetes resources.
# Runtime connectivity uses Kubernetes service DNS, not these declarations.

wiring:
  - from: identity
    to: sandbox
    via: oidc-jwks        # gateway fetches JWKS endpoint from Keycloak to validate JWTs
  - from: virtualization
    to: sandbox
    via: kubevirt-runtime # sandbox VMs require the CNV hypervisor to be running
  # Note: image-builder is a custom component (deploy: manual), not a block,
  # so the CDI DataSource dependency cannot be expressed as a wiring entry.
  # The relationship is documented in the image-builder component description.

# ── Custom Components ─────────────────────────────────────────────────────────
#
# All charts are hand-written and live in charts/ or image-builder-charts/.
# They were copied from the original validatedpatterns-sandbox/secure-agent-workspace
# repo without modification.
#
# Each component marked deploy: argocd (the default) compiles to an entry in
# clusterGroup.applications (← values-prod.yaml). Components marked
# deploy: manual are kept in the repo for reference but are NOT managed by
# ArgoCD — they are applied manually via Makefile targets.

custom:

  # ── openshift-registry ───────────────────────────────────────────────────
  # Enables the OpenShift integrated image registry so BuildConfigs
  # (used by the image-builder pipeline) can push images internally.
  # ← values-prod.yaml: applications.openshift-registry
  #   path: charts/openshift-registry
  #   namespace: openshift-image-registry
  # ← charts/openshift-registry/templates/registry-config.yaml
  openshift-registry:
    description: Enable OpenShift integrated image registry for BuildConfig push targets
    source:
      chart: charts/openshift-registry
    namespace: openshift-image-registry  # ← values-prod.yaml: applications.openshift-registry.namespace

  # ── openshift-cnv ────────────────────────────────────────────────────────
  # Deploys the HyperConverged CR that activates the CNV/KubeVirt stack
  # after the kubevirt-hyperconverged operator (from the virtualization block)
  # finishes installing. Without this CR, VMs cannot be created.
  # ← values-prod.yaml: applications.openshift-cnv
  #   path: charts/openshift-cnv
  #   namespace: openshift-cnv
  # ← charts/openshift-cnv/templates/hyperconverged.yaml
  openshift-cnv:
    description: HyperConverged CR — activates KubeVirt runtime and CDI importer
    source:
      chart: charts/openshift-cnv
    namespace: openshift-cnv           # ← values-prod.yaml: applications.openshift-cnv.namespace

  # ── openshell-keycloak ───────────────────────────────────────────────────
  # Deploys the RHBK Keycloak instance + PostgreSQL backend + the openshell
  # realm with its clients and test users. The operator (from the identity
  # block) must be installed before this chart is applied.
  # ← values-prod.yaml: applications.openshell-keycloak
  #   path: charts/openshell-keycloak
  #   namespace: openshell-agents
  # ← charts/openshell-keycloak/templates/keycloak.yaml      (Keycloak CR)
  # ← charts/openshell-keycloak/templates/postgres.yaml      (PostgreSQL)
  # ← charts/openshell-keycloak/templates/realm-import.yaml  (KeycloakRealmImport)
  openshell-keycloak:
    description: RHBK Keycloak instance with openshell realm, PostgreSQL backend, test users
    source:
      chart: charts/openshell-keycloak
    namespace: openshell-agents        # ← values-prod.yaml: applications.openshell-keycloak.namespace

  # ── pattern-secrets ──────────────────────────────────────────────────────
  # ExternalSecrets that pull inference provider API keys and SSH keypairs
  # from Vault and materialise them as Kubernetes Secrets in openshell-agents.
  # One ExternalSecret per provider. Each reads from the vault_path declared
  # in the secrets: section above.
  # ← values-prod.yaml: applications.pattern-secrets
  #   path: charts/pattern-secrets
  #   namespace: openshell-agents
  # ← charts/pattern-secrets/templates/*.yaml (ten ExternalSecret templates)
  pattern-secrets:
    description: ExternalSecrets for SSH keypair and all inference provider API keys
    source:
      chart: charts/pattern-secrets
    namespace: openshell-agents        # ← values-prod.yaml: applications.pattern-secrets.namespace

  # ── openshell-saw ────────────────────────────────────────────────────────
  # The core sandbox chart. Manages the lifecycle of per-user KubeVirt VMs:
  #   - VirtualMachine CR (CDI clone of the golden image)
  #   - OpenShift Routes (gRPC passthrough + dashboard edge TLS)
  #   - RBAC (ServiceAccount, Role, ClusterRole for registry access)
  #   - cloud-init Secret (SSH key injection, OIDC config, provider API key)
  #   - Setup Job (post-create hook that registers the VM with the gateway)
  #
  # ← values-prod.yaml: applications.openshell-saw
  #   path: charts/openshell-saw
  #   namespace: openshell-agents
  #   extraValueFiles: [/overrides/openshell-saw.yaml]
  #
  # extraValueFiles loads overrides/openshell-saw.yaml which sets the default
  # sandbox configuration (provider, model, namespace_mode). This file is part
  # of the repo and is committed alongside the chart.
  # ← values-prod.yaml: applications.openshell-saw.extraValueFiles
  openshell-saw:
    description: Per-user KubeVirt VM sandboxes with OpenShell gateway, OIDC auth, and agent runtime
    source:
      chart: charts/openshell-saw
    namespace: openshell-agents        # ← values-prod.yaml: applications.openshell-saw.namespace
    extraValueFiles:
      - /overrides/openshell-saw.yaml  # ← values-prod.yaml: applications.openshell-saw.extraValueFiles

  # ── image-builder (deploy: manual) ───────────────────────────────────────
  # Bootc image build pipeline. Builds three images in sequence:
  #   1. NemoClaw sandbox container image  (nemoclaw-imagestream)
  #   2. NemoClaw CLI image                (nemoclaw-cli-imagestream)
  #   3. OpenShell gateway bootc VM image  (openshell-gateway-image)
  #      → registers as CDI DataSource openshell-gateway-golden in build-saw-images
  #
  # The CDI DataSource is what the openshell-saw chart clones for each new VM.
  #
  # deploy: manual — this pipeline runs ONCE before first sandbox creation and
  # takes ~15 minutes. It is NOT managed by ArgoCD because:
  #   - It runs BuildConfigs synchronously; ArgoCD would re-trigger on every drift
  #   - The CDI DataSource is a one-time artifact, not a continuously reconciled state
  #
  # Run manually:
  #   make build               # NemoClaw sandbox image
  #   make build-cli           # NemoClaw CLI image
  #   make build-gateway-image # Bootc gateway VM image → CDI DataSource
  #
  # Note: in a future release this step is expected to be replaced by a pull
  # from pre-built upstream NVIDIA images (source: prebuilt in vm-workspace block).
  #
  # Source charts live under image-builder-charts/helm/ (three sub-charts).
  # This component is not in the original values-prod.yaml applications list —
  # the hand-written repo applies these charts via Makefile, not ArgoCD.
  image-builder:
    description: Bootc image build pipeline (NemoClaw + OpenShell gateway VM image)
    deploy: manual
    source:
      chart: image-builder-charts/helm
    namespace: build-saw-images        # ← image-builder-charts/helm/*/values.yaml: namespace

# ── Docs ─────────────────────────────────────────────────────────────────────
#
# Source documentation in docs/ is processed into both vp-out/ and qs-out/.
# Sections marked <!-- vp-only --> are stripped from the QS output.
# Sections marked <!-- qs-only --> are stripped from the VP output.
# Unmarked sections appear in both outputs unchanged.
# Marker comment lines are always stripped — they don't appear in output.

docs:
  # Primary README — shared content with conditional install instructions.
  # vp-only:  Option A (./pattern.sh make install)
  # qs-only:  Option B (make keycloak, make openshell-saw-create, etc.)
  - source: docs/README.md
    target: README.md

options:
  # ← values-global.yaml: main.multiSourceConfig.enabled: true
  # Required: the openshell-saw ArgoCD app uses extraValueFiles which depends
  # on multi-source ArgoCD application support (ArgoCD >= 2.6).
  multiSourceConfig: true

  # ← values-global.yaml: main.clusterGroupChartVersion
  clustergroup_version: "0.9.*"

  # syncPolicy: Automatic — ArgoCD auto-syncs all applications without manual approval.
  # Change to Manual if you want to review diffs before ArgoCD applies them.
  syncPolicy: Automatic

  # installPlanApproval: Automatic — OLM installs operator updates without manual approval.
  # Change to Manual for production environments where operator upgrades need review.
  installPlanApproval: Automatic
